<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shipping Cost Predictor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-dark: #1d4ed8;
            --secondary-color: #64748b;
            --success-color: #059669;
            --background: #f8fafc;
            --surface: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            color: var(--text-primary);
            margin: 0;
            padding: 0;
        }

        .main-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .header p {
            font-size: 1.1rem;
            color: var(--text-secondary);
            margin: 0;
        }

        .form-card {
            background: var(--surface);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section:last-child {
            margin-bottom: 0;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-select, .form-control {
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.2s ease;
            background: var(--surface);
            width: 100%;
        }

        .form-select:focus, .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            outline: none;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .input-group-single {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1rem;
        }

        /* Added styles for input labels and wrappers */
        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .input-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            margin: 0;
        }

        .form-control[readonly] {
            background-color: #f8fafc;
            color: var(--text-secondary);
            cursor: not-allowed;
        }

        .submit-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            border: none;
            border-radius: 12px;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.3);
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .input-group {
                grid-template-columns: 1fr;
            }

            .form-card {
                padding: 1.5rem;
            }

            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Enhanced header with better typography and spacing -->
        <div class="header">
            <h1>Shipping Cost Predictor</h1>
            <p>Get accurate shipping cost estimates for your signage projects</p>
        </div>

        <!-- Modern card-based form layout with improved styling -->
        <div class="form-card">
            <form method="POST">
                <div class="form-section">
                    <h4 class="section-title">
                        <svg class="icon" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
                        </svg>
                        Select Sign Type
                    </h4>
                    <select name="sign_type" class="form-select" required>
                        {% for label, value in sign_types.items() %}
                            <option value="{{ value }}" {% if value == default_sign_type %}selected{% endif %}>
                                {{ label }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-section">
                    <h4 class="section-title">
                        <svg class="icon" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        Choose Prediction Model
                    </h4>
                    <select name="model_name" class="form-select" required>
                        {% for model in models %}
                            <option value="{{ model }}">{{ model }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-section">
                    <h4 class="section-title">
                        <svg class="icon" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9 2a1 1 0 000 2h2a1 1 0 102 0V3h4v1a1 1 0 102 0V3a2 2 0 012 2v6a2 2 0 01-2 2H6a2 2 0 01-2-2V5zm3 4a1 1 0 000 2h.01a1 1 0 100-2H7zm3 0a1 1 0 000 2h3a1 1 0 100-2h-3zm-3 4a1 1 0 100 2h.01a1 1 0 100-2H7zm3 0a1 1 0 100 2h3a1 1 0 100-2h-3z"/>
                        </svg>
                        Enter Sign Dimensions
                    </h4>
                    <!-- Added proper labels and auto-calculation for area -->
                    <div class="input-group">
                        <div class="input-wrapper">
                            <label for="width" class="input-label">Width (inches)</label>
                            <input type="number" step="any" name="width" id="width" placeholder="Enter width" class="form-control" required oninput="calculateArea()">
                        </div>
                        <div class="input-wrapper">
                            <label for="height" class="input-label">Height (inches)</label>
                            <input type="number" step="any" name="height" id="height" placeholder="Enter height" class="form-control" required oninput="calculateArea()">
                        </div>
                    </div>
                    <div class="input-group-single">
                        <div class="input-wrapper">
                            <label for="depth" class="input-label">Depth (inches)</label>
                            <input type="number" step="any" name="depth" id="depth" placeholder="Enter depth" class="form-control" required>
                        </div>
                    </div>
                    <div class="input-group-single">
                        <div class="input-wrapper">
                            <label for="area" class="input-label">Area (square inches) - Auto-calculated</label>
                            <input type="number" step="any" name="area" id="area" placeholder="Area will be calculated automatically" class="form-control" readonly>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Calculate Shipping Cost
                </button>
            </form>
        </div>
    </div>

    <!-- Added JavaScript for automatic area calculation -->
    <script>
        function calculateArea() {
            const width = parseFloat(document.getElementById('width').value) || 0;
            const height = parseFloat(document.getElementById('height').value) || 0;
            const area = width * height;

            // Always show the calculated value, even if it's 0
            document.getElementById('area').value = area.toFixed(2);
        }

        // Initialize area calculation on page load
        document.addEventListener('DOMContentLoaded', function() {
            calculateArea();
        });
    </script>
</body>
</html>
